name: Release

# Attaches the build as one zip to every published release. The Marketplace
# installs it unpacked (see hacs.json): pokemon-card-lit.js at the root, the
# chunks it loads in chunks/.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      # Builds and packs pokemon-card-lit.zip, then tests the zip in Chrome
      # (preinstalled on the runner).
      - run: bun run test:release
      - name: Upload the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" pokemon-card-lit.zip --clobber
