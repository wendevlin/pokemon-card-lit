name: Release

# Attaches two assets to every published release:
# - pokemon-card-lit.zip: the build with chunks. Named like the resource in
#   hacs.json, the Marketplace installs it unpacked instead of the legacy file:
#   pokemon-card-lit.js at the root, the chunks it loads in chunks/.
# - pokemon-card-lit.js: the legacy build, everything in one file, for
#   versions that can't install a zip.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      # Builds both into release/, then tests both in Chrome (preinstalled on
      # the runner).
      - run: bun run test:release
      - name: Upload the zip and the legacy file to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/pokemon-card-lit.zip release/pokemon-card-lit.js --clobber
